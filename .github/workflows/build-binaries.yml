name: build-binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos-arm64-metal:
    name: macOS arm64 (Apple Silicon, Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze (cmake)
        run: brew install cmake

      - name: Clona fork llama.cpp (moe-expansion)
        run: git clone --depth 1 -b moe-expansion https://github.com/vagrillo/llama.cpp llama.cpp

      - name: Build AgrillaMoE (Metal)
        env:
          AGRILLA_JOBS: '3'
        run: ./build-macos.sh

      - name: Smoke test (--version)
        run: ./dist/macos/agrillamoe --version

      - name: Pakkettizza
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          tar -czf "agrillamoe-${VER}-macos-arm64-metal.tar.gz" -C dist/macos agrillamoe
          shasum -a 256 "agrillamoe-${VER}-macos-arm64-metal.tar.gz"

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: agrillamoe-macos-arm64-metal
          path: agrillamoe-*.tar.gz

      - name: Allega alla release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" agrillamoe-*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  macos-moe-benchmark:
    name: Benchmark MoE su M1 (baseline per tuning kernel Metal)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze
        run: brew install cmake
      - name: Clona fork
        run: git clone --depth 1 -b moe-expansion https://github.com/vagrillo/llama.cpp llama.cpp
      - name: Build (llama-bench + agrillamoe)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DAGRILLA_LLAMA_DIR="$PWD/llama.cpp"
          cmake --build build --target agrillamoe llama-bench -j3
          BIN=$(ls build/agrillamoe 2>/dev/null || ls build/bin/agrillamoe)
          echo "BIN=$BIN" >> "$GITHUB_ENV"
      - name: Scarica MoE di test (Qwen3-30B-A3B, UD-IQ1_S ~8.4GB per 14GB di RAM runner)
        run: |
          mkdir -p models
          curl -L --fail -o models/Qwen3-30B-A3B-UD-IQ1_S.gguf "https://huggingface.co/unsloth/Qwen3-30B-A3B-GGUF/resolve/main/Qwen3-30B-A3B-UD-IQ1_S.gguf"
      - name: llama-bench — nativo vs espansione (decode e prompt)
        run: |
          M=models/Qwen3-30B-A3B-UD-IQ1_S.gguf
          echo "=== nativo (top-8) ==="
          ./build/bin/llama-bench -m "$M" -p 128,512 -n 64 -ngl 99 -r 2 -fa auto 2>/dev/null || ./build/llama-bench -m "$M" -p 128,512 -n 64 -ngl 99 -r 2
          # llama-bench non espone i flag moe-*: uso agrillamoe (llama-server) e il timing del log
          bench_srv() {
            TAG="$1"; shift
            "$BIN" -m "$M" --host 127.0.0.1 --port 8099 --no-browser \
              --reasoning off -c 2048 -np 1 "$@" > "/tmp/srv-$TAG.log" 2>&1 &
            SRV=$!
            for i in $(seq 1 100); do
              sleep 3
              curl -sf -m 3 http://127.0.0.1:8099/health >/dev/null 2>&1 && break
              kill -0 $SRV 2>/dev/null || break
            done
            curl -s -m 600 http://127.0.0.1:8099/v1/chat/completions \
              -H 'Content-Type: application/json' \
              -d '{"messages":[{"role":"user","content":"Scrivi un paragrafo lungo sull universo."}],"max_tokens":64,"temperature":0}' >/dev/null
            echo "=== $TAG ==="
            grep -E "prompt eval time|eval time" "/tmp/srv-$TAG.log" | tail -2
            kill $SRV 2>/dev/null
            sleep 3
          }
          bench_srv "espansione 20 esperti T0.8 tutti i layer" --moe-experts 20 --moe-expert-threshold 0.8
          bench_srv "espansione 20 T0.8 layer 25-39 (profilo 35B)" --moe-experts 20 --moe-expert-threshold 0.8 --moe-expert-layer-start 25 --moe-expert-layer-end 39
          bench_srv "nativo top-8 (via server, confronto tg)" --no-moe-expansion
      - name: Report
        run: |
          echo "Confronta le righe tg (decode) e pp (prompt) tra nativo e espansione."
          echo "Il delta e' il costo dell'espansione sui kernel Metal."
          echo "Baseline per il tuning di N_R0_*/N_SG_* in kernels/mul_mv.metal (ggml-metal del fork)."

  macos-load-35b-repro:
    name: Riproduzione crash Metal con Qwen3.6-35B (dk256) su M1
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze
        run: brew install cmake
      - name: Clona fork
        run: git clone --depth 1 -b moe-expansion https://github.com/vagrillo/llama.cpp llama.cpp
      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DAGRILLA_LLAMA_DIR="$PWD/llama.cpp"
          cmake --build build --target agrillamoe -j3
      - name: Scarica Qwen3.6-35B-A3B UD-IQ1_M (9.4GB)
        run: |
          mkdir -p models
          curl -L --fail -o models/agg.gguf "https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-IQ1_M.gguf"
      - name: Avvio con le stesse opzioni (ctx ridotto per la RAM del runner) e backtrace se crasha
        run: |
          set +e
          "$BIN" -m models/agg.gguf --host 127.0.0.1 --port 8098 --no-browser --reasoning off -c 4096 -np 1 -v > /tmp/load.log 2>&1 &
          SRV=$!
          OK=0
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf -m 3 http://127.0.0.1:8098/health >/dev/null 2>&1; then OK=1; break; fi
            kill -0 $SRV 2>/dev/null || break
          done
          if [ "$OK" = "1" ]; then
            echo "SERVER OK su M1: il crash non si riproduce su M1 (probabile dipendenza dal chip)"
            curl -s -m 300 http://127.0.0.1:8098/v1/chat/completions -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"rispondi OK"}],"max_tokens":16,"temperature":0}' | head -c 300; echo
            kill $SRV
          else
            echo "=== CRASH RIPRODOTTO su M1: ultime righe ==="
            tail -25 /tmp/load.log
            echo "=== tentativo backtrace con lldb ==="
            lldb -b -o "run -m models/agg.gguf --host 127.0.0.1 --port 8098 --no-browser --reasoning off -c 4096 -np 1" "$BIN" 2>&1 | tail -40
          fi
