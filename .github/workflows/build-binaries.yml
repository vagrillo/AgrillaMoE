name: build-binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos-arm64-metal:
    name: macOS arm64 (Apple Silicon, Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze (cmake)
        run: brew install cmake

      - name: Clona fork llama.cpp (moe-expansion)
        run: git clone --depth 1 -b moe-expansion https://github.com/vagrillo/llama.cpp llama.cpp

      - name: Build AgrillaMoE (Metal)
        env:
          AGRILLA_JOBS: '3'
        run: ./build-macos.sh

      - name: Smoke test (--version)
        run: ./dist/macos/agrillamoe --version

      - name: Pakkettizza
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          tar -czf "agrillamoe-${VER}-macos-arm64-metal.tar.gz" -C dist/macos agrillamoe
          shasum -a 256 "agrillamoe-${VER}-macos-arm64-metal.tar.gz"

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: agrillamoe-macos-arm64-metal
          path: agrillamoe-*.tar.gz

      - name: Allega alla release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" agrillamoe-*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
