; AgrillaMoE sotto supervisord — il PyWorker di vast.ai (BACKEND=llama) taila
; /var/log/portal/llama.log e attende "model loaded" come readiness; il marker
; d'errore "INFO exited: llama" e' emesso da supervisord stesso su questo file.
[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/portal/llama.log
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:llama]
command=/usr/local/bin/run-model.sh
autorestart=true
startsecs=5
startretries=2
stopwaitsecs=60
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/portal/llama.log
stdout_logfile_maxbytes=0
environment=HOME="/root"
